name: Refresh data and deploy GEAR
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install updater dependencies
        run: pip install -r requirements.txt
      - name: Refresh allowlisted official sources
        run: python scripts/update_data.py
      - name: Commit refreshed data when changed
        run: |
          git config user.name "gear-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/countries.json data/ingestion_status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official source observations"
            git push
          fi
      - name: Build static site artifact
        run: |
          mkdir -p _site
          cp index.html styles.css app.js .nojekyll _site/
          cp -r data _site/data
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: refresh
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
