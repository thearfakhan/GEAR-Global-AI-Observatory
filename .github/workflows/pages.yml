name: Refresh data and deploy GEAR

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install updater dependencies
        run: pip install -r requirements.txt

      - name: Refresh official-source data
        run: python scripts/update_data.py

      - name: Build GEAR website
        run: |
          mkdir -p _site
          cp index.html styles.css app.js .nojekyll _site/
          cp -r data _site/data

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy GEAR to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
